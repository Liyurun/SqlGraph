name: Scale Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python tools/benchmark_scale.py --counts 1000,10000 --output .benchmarks/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: scale-benchmark
          path: .benchmarks/result.json
