name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . networkx pytest pytest-cov ruff mypy build

      - name: Run open-source guard
        run: python scripts/opensource_guard.py

      - name: Run tests
        run: pytest -q

      - name: Run release gates
        if: matrix.python-version == '3.12'
        run: PYTHON=python bash tools/ci_checks.sh
