[tool.poetry]
name = "sqlgraph-lineage"
version = "0.1.0"
description = "SQL-to-Knowledge-Graph engine for data warehouses: lineage, columns, and reusable transformation logic."
authors = ["sqlgraph contributors"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Liyurun/SqlGraph"
repository = "https://github.com/Liyurun/SqlGraph"
documentation = "https://github.com/Liyurun/SqlGraph#readme"
keywords = ["sql", "lineage", "data-lineage", "knowledge-graph", "data-warehouse", "sqlglot", "graphrag", "data-governance"]
packages = [{include = "sqlgraph"}]
include = [
    { path = "CAPABILITIES.yaml", format = ["sdist", "wheel"] },
    { path = "assets/*.png", format = "sdist" },
    { path = "docs/*.md", format = "sdist" },
    { path = "schemas/*.json", format = ["sdist", "wheel"] },
    { path = "examples/ads_pipeline/**/*", format = ["sdist", "wheel"] },
    { path = "examples/minimal/**/*", format = ["sdist", "wheel"] },
    { path = "examples/book_cases/**/*", format = ["sdist", "wheel"] },
    { path = "examples/video_commercial_warehouse/**/*", format = "sdist" },
    { path = "examples/df_sample.csv", format = ["sdist", "wheel"] },
    { path = "examples/table_ddl_sample.csv", format = ["sdist", "wheel"] },
    { path = "sqlgraph/serve/web/**/*.j2", format = ["sdist", "wheel"] },
    { path = "sqlgraph/serve/web/static/*", format = ["sdist", "wheel"] },
    { path = "sqlgraph/visualize/templates/*.j2", format = ["sdist", "wheel"] },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[tool.poetry.scripts]
sqlgraph = "sqlgraph.cli:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
sqlglot = ">=25.0.0"
pandas = ">=2.0.0"
typer = ">=0.9.0"
jinja2 = ">=3.1.0"
rich = ">=13.0.0"
duckdb = ">=1.0.0"
jsonschema = ">=4.18.0"
pyyaml = ">=6.0.0"
networkx = {version = ">=3.0", optional = true}
ipython = {version = ">=8.0", optional = true}
node2vec = {version = ">=0.5.0", optional = true}
scikit-learn = {version = ">=1.3.0", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
ruff = ">=0.5.0"
mypy = ">=1.8.0"
build = ">=1.2.0"

[tool.poetry.extras]
analysis = []
notebook = ["ipython"]
graph = ["networkx"]
high-performance-graph = ["networkx"]
community = ["networkx"]
embeddings = ["node2vec"]
anomaly = ["scikit-learn"]
all = [
    "networkx",
    "ipython",
    "node2vec",
    "scikit-learn",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["sqlgraph"]
branch = false

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["F", "B", "E7"]
ignore = ["B008", "B904", "E702", "F401", "F541", "F841"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**" = ["F401", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
exclude = "(^|/)(docs|tests)/"
