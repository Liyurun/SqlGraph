[tool.poetry]
name = "sqlgraph-lineage"
version = "0.1.0"
description = "SQL-to-Knowledge-Graph engine for data warehouses: lineage, columns, and reusable transformation logic."
authors = ["sqlgraph contributors"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Liyurun/SqlGraph"
repository = "https://github.com/Liyurun/SqlGraph"
documentation = "https://github.com/Liyurun/SqlGraph#readme"
keywords = ["sql", "lineage", "data-lineage", "knowledge-graph", "data-warehouse", "sqlglot", "graphrag", "data-governance"]
packages = [{include = "sqlgraph"}]
include = [
    { path = "assets/*.png", format = "sdist" },
    { path = "docs/architecture.md", format = "sdist" },
    { path = "examples/ads_pipeline/**/*", format = ["sdist", "wheel"] },
    { path = "examples/df_sample.csv", format = ["sdist", "wheel"] },
    { path = "examples/table_ddl_sample.csv", format = ["sdist", "wheel"] },
    { path = "sqlgraph/serve/web/**/*.j2", format = ["sdist", "wheel"] },
    { path = "sqlgraph/serve/web/static/*", format = ["sdist", "wheel"] },
    { path = "sqlgraph/visualize/templates/*.j2", format = ["sdist", "wheel"] },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[tool.poetry.scripts]
sqlgraph = "sqlgraph.cli:main"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
sqlglot = ">=25.0.0"
pandas = ">=2.0.0"
typer = ">=0.9.0"
jinja2 = ">=3.1.0"
rich = ">=13.0.0"
duckdb = ">=1.0.0"
jsonschema = ">=4.18.0"
pyyaml = ">=6.0.0"
networkx = {version = ">=3.0", optional = true}
ipython = {version = ">=8.0", optional = true}
node2vec = {version = ">=0.5.0", optional = true}
scikit-learn = {version = ">=1.3.0", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"

[tool.poetry.extras]
analysis = []
notebook = ["ipython"]
graph = ["networkx"]
high-performance-graph = ["networkx"]
community = ["networkx"]
embeddings = ["node2vec"]
anomaly = ["scikit-learn"]
all = [
    "networkx",
    "ipython",
    "node2vec",
    "scikit-learn",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
